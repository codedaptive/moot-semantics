  <rect class="box" x="60" y="372" width="290" height="52" rx="6"/>
  <text class="label" x="205" y="394" text-anchor="middle">rust/src/lib.rs</text>
  <text class="sub" x="205" y="410" text-anchor="middle">aria-lexicon-lib crate + #[cfg(test)] parity gate</text>

  <line class="loop" x1="130" y1="202" x2="130" y2="370"/>
