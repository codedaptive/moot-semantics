<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <style>
    .box   { fill: #ffffff; stroke: #333; stroke-width: 1.5; }
    .label { font-size: 13px; fill: #111; }
    .sub   { font-size: 10.5px; fill: #555; }
    .flow  { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .loop  { stroke: #888; stroke-width: 1.3; fill: none; marker-end: url(#arrow); stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #999; stroke-width: 1.2; stroke-dasharray: 7 4; }
    .regionlabel { font-size: 11px; fill: #777; font-style: italic; }
  </style>

  <!-- Title -->
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#111">AriaLexiconLib: the ARIA grammar as data</text>

  <!-- Grammar statement -->
  <rect class="box" x="330" y="55" width="200" height="46" rx="6"/>
  <text class="label" x="430" y="74" text-anchor="middle">AriaLexiconLib.grammar</text>
  <text class="sub" x="430" y="89" text-anchor="middle">"verb applied to noun, ± adjectives"</text>

  <!-- Vocabulary row -->
  <rect class="box" x="60" y="150" width="140" height="52" rx="6"/>
  <text class="label" x="130" y="172" text-anchor="middle">Noun</text>
  <text class="sub" x="130" y="188" text-anchor="middle">8 shapes; drawer primary</text>

  <rect class="box" x="300" y="150" width="140" height="52" rx="6"/>
  <text class="label" x="370" y="172" text-anchor="middle">Verb</text>
  <text class="sub" x="370" y="188" text-anchor="middle">9 actions; 3 flows</text>

  <rect class="box" x="540" y="150" width="150" height="52" rx="6"/>
  <text class="label" x="615" y="172" text-anchor="middle">Adjective</text>
  <text class="sub" x="615" y="188" text-anchor="middle">4 categories, cross-noun</text>

  <!-- Acceptance matrix -->
  <rect class="box" x="170" y="250" width="200" height="52" rx="6"/>
  <text class="label" x="270" y="272" text-anchor="middle">Acceptance</text>
  <text class="sub" x="270" y="288" text-anchor="middle">verb-noun matrix (hand-authored)</text>

  <!-- Arrows: grammar frames the three vocab pieces (loose, dashed context) -->
  <line class="loop" x1="380" y1="101" x2="150" y2="148"/>
  <line class="loop" x1="420" y1="101" x2="380" y2="148"/>
  <line class="loop" x1="470" y1="101" x2="610" y2="148"/>

  <!-- Arrows: Noun and Verb feed Acceptance -->
