<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <style>
    .box   { fill: #ffffff; stroke: #333; stroke-width: 1.5; }
    .art   { fill: #f4f4f4; stroke: #777; stroke-width: 1.2; }
    .label { font-size: 13px; fill: #111; }
    .sub   { font-size: 10.5px; fill: #555; }
    .flow  { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .loop  { stroke: #888; stroke-width: 1.3; fill: none; marker-end: url(#arrow); stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #999; stroke-width: 1.2; stroke-dasharray: 7 4; }
    .regionlabel { font-size: 11px; fill: #777; font-style: italic; }
  </style>

  <!-- Title -->
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#111">LatticeLib: text in, lattice code out</text>
  <text class="sub" x="20" y="46">v1.0.24: pool cap, self-cycle guard, and explicit LexRank sentinels.</text>

  <!-- Main pipeline row -->
  <rect class="box" x="20" y="80" width="110" height="52" rx="6"/>
  <text class="label" x="75" y="102" text-anchor="middle">Input text</text>
  <text class="sub" x="75" y="118" text-anchor="middle">FDC.encodeAnchor</text>

  <rect class="box" x="170" y="80" width="130" height="52" rx="6"/>
  <text class="label" x="235" y="102" text-anchor="middle">Text primitives</text>
  <text class="sub" x="235" y="118" text-anchor="middle">Tokenizer · Normalizer · Stemmer</text>

  <rect class="box" x="340" y="80" width="130" height="52" rx="6"/>
  <text class="label" x="405" y="102" text-anchor="middle">Word-class tagger</text>
  <text class="sub" x="405" y="118" text-anchor="middle">table fast path + HMM</text>

  <rect class="box" x="510" y="80" width="120" height="52" rx="6"/>
  <text class="label" x="570" y="102" text-anchor="middle">BagBuilder</text>
  <text class="sub" x="570" y="118" text-anchor="middle">concept bag</text>

  <rect class="box" x="670" y="80" width="120" height="52" rx="6"/>
  <text class="label" x="730" y="102" text-anchor="middle">FDCMatcher</text>
  <text class="sub" x="730" y="118" text-anchor="middle">score + descend</text>

  <rect class="box" x="670" y="190" width="120" height="52" rx="6"/>
  <text class="label" x="730" y="212" text-anchor="middle">Lattice code</text>
  <text class="sub" x="730" y="228" text-anchor="middle">+ concept Q-ID</text>

  <!-- Pipeline arrows -->
  <line class="flow" x1="130" y1="106" x2="168" y2="106"/>
  <line class="flow" x1="300" y1="106" x2="338" y2="106"/>
  <line class="flow" x1="470" y1="106" x2="508" y2="106"/>
  <line class="flow" x1="630" y1="106" x2="668" y2="106"/>
  <line class="flow" x1="730" y1="132" x2="730" y2="188"/>

  <!-- Pinned artifacts region -->
  <rect class="region" x="170" y="300" width="620" height="110"/>
  <text class="regionlabel" x="180" y="318">Pinned artifacts (versioned, read-only, loaded once per process)</text>

  <rect class="art" x="190" y="332" width="130" height="52" rx="6"/>
  <text class="label" x="255" y="354" text-anchor="middle">Lexicon</text>
  <text class="sub" x="255" y="370" text-anchor="middle">~70k stems → Q-IDs</text>

  <rect class="art" x="350" y="332" width="130" height="52" rx="6"/>
  <text class="label" x="415" y="354" text-anchor="middle">FDC frame</text>
  <text class="sub" x="415" y="370" text-anchor="middle">1,075 codes + labels</text>

  <rect class="art" x="510" y="332" width="130" height="52" rx="6"/>
  <text class="label" x="575" y="354" text-anchor="middle">Code signatures</text>
  <text class="sub" x="575" y="370" text-anchor="middle">1,071 term sets</text>

  <rect class="art" x="660" y="332" width="120" height="52" rx="6"/>
  <text class="label" x="720" y="354" text-anchor="middle">QID closure</text>
  <text class="sub" x="720" y="370" text-anchor="middle">P31/P279 graph</text>

  <!-- Artifact feed arrows -->
  <line class="flow" x1="255" y1="330" x2="545" y2="134" opacity="0.55"/>
  <line class="flow" x1="415" y1="330" x2="715" y2="134" opacity="0.55"/>
  <line class="flow" x1="575" y1="330" x2="725" y2="134" opacity="0.55"/>

  <!-- Novel-token learning loop region -->
  <rect class="region" x="20" y="440" width="770" height="100"/>
  <text class="regionlabel" x="30" y="458">Novel-token learning loop (offline, opt-in via LATTICE_POOL_DIR)</text>

  <rect class="box" x="40" y="470" width="150" height="52" rx="6"/>
  <text class="label" x="115" y="492" text-anchor="middle">NovelTokenCache</text>
  <text class="sub" x="115" y="508" text-anchor="middle">drains at 50 entries</text>

  <rect class="box" x="240" y="470" width="160" height="52" rx="6"/>
  <text class="label" x="320" y="492" text-anchor="middle">NovelPoolSubmitter</text>
  <text class="sub" x="320" y="508" text-anchor="middle">JSON files → pool dir</text>

  <rect class="box" x="450" y="470" width="140" height="52" rx="6"/>
  <text class="label" x="520" y="492" text-anchor="middle">PoolReducer</text>
  <text class="sub" x="520" y="508" text-anchor="middle">merge nouns/verbs</text>

  <rect class="box" x="640" y="470" width="130" height="52" rx="6"/>
  <text class="label" x="705" y="492" text-anchor="middle">WordClassTable</text>
  <text class="sub" x="705" y="508" text-anchor="middle">live atomic swap</text>

  <!-- Loop arrows -->
  <line class="loop" x1="405" y1="132" x2="140" y2="468"/>
  <line class="loop" x1="190" y1="496" x2="238" y2="496"/>
  <line class="loop" x1="400" y1="496" x2="448" y2="496"/>
  <line class="loop" x1="590" y1="496" x2="638" y2="496"/>
  <path class="loop" d="M 705 468 C 705 430, 560 240, 440 136"/>
